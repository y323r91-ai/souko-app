<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>倉庫 持出登録システム</title>
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: sans-serif; background: #f4f6f9; margin: 0; padding: 12px; color: #333; }
    .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }
    h2 { font-size: 16px; margin: 0 0 12px 0; border-left: 4px solid #0066cc; padding-left: 8px; }
    label.field-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #555; }
    input[type="text"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 10px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-row input { margin-bottom: 0; flex: 1; }
    .btn-search { background: #0066cc; color: #fff; border: none; border-radius: 6px; padding: 0 16px; font-size: 15px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn { display: block; width: 100%; box-sizing: border-box; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 8px; }
    .btn-primary { background: #0066cc; color: #fff; }
    .btn-scan { background: #28a745; color: #fff; font-size: 18px; }
    .btn-photo { background: #ff9800; color: #fff; }
    .btn-submit { background: #d9534f; color: #fff; font-size: 18px; padding: 15px; }
    #videoContainer { display: none; width: 100%; margin-bottom: 10px; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    #videoPreview { width: 100%; max-height: 260px; object-fit: cover; display: block; }
    .scan-guide { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: red; box-shadow: 0 0 6px red; }
    .alert { background: #fff3cd; color: #856404; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; display: none; border: 1px solid #ffeeba; }
    .search-results { max-height: 200px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; display: none; }
    .search-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; background: #fff; }
    .search-item:active { background: #e9ecef; }
    .selected-box { background: #e8f4fd; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: none; border: 1px solid #b8daff; }
    .info-row { font-size: 14px; margin-bottom: 4px; }
    .badge { display: inline-block; background: #0066cc; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
    .cart-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .cart-info { font-size: 14px; flex: 1; padding-right: 8px; }
    .btn-del { background: #dc3545; color: #fff; border: none; border-radius: 4px; padding: 6px 10px; font-size: 12px; }
    .status-bar { background: #e2e3e5; color: #383d41; padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <div id="statusBar" class="status-bar">マスタデータ読込中...</div>

  <div class="card">
    <h2>1. 持出者・案件情報</h2>
    <label class="field-label">持出者名（必須）</label>
    <input type="text" id="userName" placeholder="例：山田 太郎">
    <label class="field-label">案件番号（必須）</label>
    <input type="text" id="projectNo" placeholder="例：A-1024">
    <label class="field-label">工事件名（必須）</label>
    <input type="text" id="projectName" placeholder="例：〇〇ビル改修工事">
  </div>

  <div class="card">
    <h2>2. 商品の選択・スキャン</h2>
    <button class="btn btn-scan" id="btnLiveScan" onclick="toggleLiveScanner()">📷 バーコードを読み取る</button>
    <div id="videoContainer">
      <video id="videoPreview" playsinline></video>
      <div class="scan-guide"></div>
    </div>
    <div id="scanAlert" class="alert"></div>

    <label class="field-label">キーワード検索（品番・品名・メーカー）</label>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="バーコード未登録・読取不可時はこちら" oninput="searchProducts()" onkeyup="searchProducts()">
      <button class="btn-search" onclick="searchProducts()">検索</button>
    </div>
    <div id="searchResults" class="search-results"></div>

    <div id="selectedBox" class="selected-box">
      <div class="info-row"><span class="badge">品番</span><strong id="dispCode"></strong></div>
      <div class="info-row"><span class="badge">品名</span><strong id="dispName"></strong></div>
      <div class="info-row"><span class="badge">メーカー</span><span id="dispMaker"></span></div>
      <div class="info-row"><span class="badge">棚番号</span><span id="dispShelf"></span> / <span class="badge">現在庫</span><span id="dispStock"></span></div>
      <div style="margin-top: 10px;">
        <label class="field-label">持出個数</label>
        <input type="number" id="itemQty" value="1" min="1" inputmode="numeric">
        <button class="btn btn-primary" onclick="addToCart()">＋ 持出リストに追加</button>
      </div>
    </div>

    <div style="margin-top: 14px; border-top: 1px dashed #ccc; padding-top: 12px;">
      <label class="field-label">マスタに商品がない場合（管理外物品など）</label>
      <label class="btn btn-photo" for="cameraInput">📸 商品を撮影して追加</label>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handlePhoto(event)">
    </div>
  </div>

  <div class="card">
    <h2>3. 今回の持出リスト（<span id="cartCount">0</span>件）</h2>
    <div id="cartList"><p style="color:#888; font-size:14px;">まだ商品が追加されていません。</p></div>
    <button class="btn btn-submit" id="btnSubmit" style="margin-top:15px;" onclick="submitAll()">✅ この内容で持出確定</button>
  </div>

  <script>
    // ★ここにさきほどコピーしたGASのウェブアプリURLを貼り付けてください★
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzosSJjcNHWmUazaAdaF-QitSo9mctT9PAsp17_oqK3U-WB6aUSbFtxJlrt_oGivMD3Eg/exec';

    var masterData = [];
    var currentMatches = [];
    var currentItem = null;
    var cart = [];
    var liveReader = null;
    var isLiveScanning = false;
    var stBar = document.getElementById('statusBar');

    try {
      var savedName = localStorage.getItem('warehouse_user_name');
      if (savedName) document.getElementById('userName').value = savedName;
    } catch(e) {}

    // マスタデータ取得
    fetch(GAS_API_URL)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        masterData = data || [];
        stBar.style.background = '#d4edda';
        stBar.style.color = '#155724';
        stBar.innerText = '準備完了（マスタ登録数: ' + masterData.length + '件）';
      })
      .catch(function(err) {
        stBar.style.background = '#f8d7da';
        stBar.style.color = '#721c24';
        stBar.innerText = 'マスタ読込エラー: GASのURL設定を確認してください';
      });

    function toggleLiveScanner() {
      var container = document.getElementById('videoContainer');
      var btn = document.getElementById('btnLiveScan');
      document.getElementById('scanAlert').style.display = 'none';

      if (isLiveScanning) {
        stopLiveScanner();
        return;
      }

      try {
        var hints = new Map();
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        liveReader = new ZXing.BrowserMultiFormatReader(hints);
        container.style.display = 'block';
        btn.innerText = '⏹ カメラを閉じる';
        isLiveScanning = true;

        liveReader.decodeFromConstraints(
          { video: { facingMode: 'environment' } },
          'videoPreview',
          function(result, err) {
            if (result) {
              stopLiveScanner();
              onBarcodeScanned(result.text);
            }
          }
        ).catch(function(err) {
          stopLiveScanner();
          alert('カメラを起動できませんでした。スマホのブラウザ設定でカメラを許可してください。');
        });
      } catch (e) {
        stopLiveScanner();
        alert('カメラ起動エラー: ' + e.message);
      }
    }

    function stopLiveScanner() {
      if (liveReader) {
        try { liveReader.reset(); } catch(e) {}
      }
      document.getElementById('videoContainer').style.display = 'none';
      document.getElementById('btnLiveScan').innerText = '📷 バーコードを読み取る';
      isLiveScanning = false;
    }

    function onBarcodeScanned(code) {
      var cleanCode = String(code).trim();
      var found = null;
      for (var i = 0; i < masterData.length; i++) {
        var row = masterData[i];
        if (row.barcode === cleanCode) {
          found = row;
          break;
        }
      }
      var alertBox = document.getElementById('scanAlert');
      if (found) {
        alertBox.style.display = 'none';
        selectProduct(found);
      } else {
        document.getElementById('selectedBox').style.display = 'none';
        alertBox.innerHTML = '⚠️ <strong>未登録のバーコード（' + cleanCode + '）です。</strong><br>下の検索窓から品番・品名で検索して選択してください。';
        alertBox.style.display = 'block';
        document.getElementById('searchInput').focus();
      }
    }

    function searchProducts() {
      var q = document.getElementById('searchInput').value.trim().toLowerCase();
      var resDiv = document.getElementById('searchResults');
      if (!q) {
        resDiv.style.display = 'none';
        return;
      }
      currentMatches = [];
      for (var i = 0; i < masterData.length; i++) {
        var item = masterData[i];
        if (item.barcode.toLowerCase().indexOf(q) !== -1 ||
            item.code.toLowerCase().indexOf(q) !== -1 ||
            item.name.toLowerCase().indexOf(q) !== -1 ||
            item.maker.toLowerCase().indexOf(q) !== -1) {
          currentMatches.push(item);
          if (currentMatches.length >= 30) break;
        }
      }

      if (currentMatches.length === 0) {
        resDiv.innerHTML = '<div class="search-item" style="color:#888;">該当する商品がありません</div>';
      } else {
        var html = '';

      for (var j = 0; j < currentMatches.length; j++) {
var m = currentMatches[j];
html += '' +
'' + m.code + ' : ' + m.name + '
' +
'メーカー: ' + (m.maker || '-') + ' / 棚: ' + (m.shelf || '-') + '' +
'';
}
resDiv.innerHTML = html;
}
resDiv.style.display = 'block';
}
function selectMatch(index) {
selectProduct(currentMatches[index]);
}
function selectProduct(item) {
currentItem = item;
document.getElementById('searchResults').style.display = 'none';
document.getElementById('searchInput').value = '';
document.getElementById('dispCode').innerText = item.code;
document.getElementById('dispName').innerText = item.name;
document.getElementById('dispMaker').innerText = item.maker || '未登録';
document.getElementById('dispShelf').innerText = item.shelf || '未登録';
document.getElementById('dispStock').innerText = item.stock || '未登録';
document.getElementById('itemQty').value = 1;
document.getElementById('selectedBox').style.display = 'block';
}
function addToCart() {
if (!currentItem) return;
var qty = parseInt(document.getElementById('itemQty').value, 10);
if (!qty || qty <= 0) {
alert('個数を1以上で入力してください');
return;
}
cart.push({
barcode: currentItem.barcode,
code: currentItem.code,
name: currentItem.name,
qty: qty,
photoBase64: null
});
currentItem = null;
document.getElementById('selectedBox').style.display = 'none';
document.getElementById('scanAlert').style.display = 'none';
renderCart();
}
function handlePhoto(event) {
var files = event.target.files;
if (!files || files.length === 0) return;
var file = files[0];
var qtyStr = prompt('撮影した商品の「持出個数」を入力してください', '1');
if (qtyStr === null) {
event.target.value = '';
return;
}
var qty = parseInt(qtyStr, 10);
if (!qty || qty <= 0) {
alert('有効な個数を入力してください');
event.target.value = '';
return;
}
var objectUrl = URL.createObjectURL(file);
var img = new Image();
img.onload = function() {
var canvas = document.createElement('canvas');
var maxW = 800;
var scale = Math.min(1, maxW / img.width);
canvas.width = Math.round(img.width * scale);
canvas.height = Math.round(img.height * scale);
var ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
URL.revokeObjectURL(objectUrl);
var resizedBase64 = canvas.toDataURL('image/jpeg', 0.7);
cart.push({
barcode: '',
code: 'マスタ外商品',
name: '📸 撮影画像あり',
qty: qty,
photoBase64: resizedBase64
});
renderCart();
event.target.value = '';
};
img.src = objectUrl;
}
function removeCartItem(index) {
cart.splice(index, 1);
renderCart();
}
function renderCart() {
document.getElementById('cartCount').innerText = cart.length;
const listDiv = document.getElementById('cartList');
if (cart.length === 0) {
listDiv.innerHTML = 'まだ商品が追加されていません。';
return;
}
let html = '';
for (let i = 0; i < cart.length; i++) {
const item = cart[i];
html += '' +
'' +
'' + item.code + ' / ' + item.name + '
' +
'数量: ' + item.qty + '' +
'' +
'削除' +
'';
}
listDiv.innerHTML = html;
}
function submitAll() {
var userName = document.getElementById('userName').value.trim();
var projectNo = document.getElementById('projectNo').value.trim();
var projectName = document.getElementById('projectName').value.trim();
if (!userName || !projectNo || !projectName) {
alert('「持出者名」「案件番号」「工事件名」をすべて入力してください。');
return;
}
if (cart.length === 0) {
alert('持出リストに商品が1つも入っていません。');
return;
}
try {
localStorage.setItem('warehouse_user_name', userName);
} catch(e) {}
var btn = document.getElementById('btnSubmit');
btn.disabled = true;
btn.innerText = '送信中...';
var payload = { userName: userName, projectNo: projectNo, projectName: projectName, items: cart };
fetch(GAS_API_URL, {
method: 'POST',
body: JSON.stringify(payload)
})
.then(function(res) { return res.json(); })
.then(function(data) {
btn.disabled = false;
btn.innerText = '✅ この内容で持出確定';
if (data.status === 'ok') {
alert('登録が完了しました！（' + data.count + '件）');
cart = [];
renderCart();
document.getElementById('projectNo').value = '';
document.getElementById('projectName').value = '';
} else {
alert('エラー: ' + data.message);
}
})
.catch(function(err) {
btn.disabled = false;
btn.innerText = '✅ この内容で持出確定';
alert('送信エラーが発生しました: ' + err);
});
}
